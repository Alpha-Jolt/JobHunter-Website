services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_STRIPE_SUPABASE_PUBLISHABLE_KEY=${VITE_STRIPE_SUPABASE_PUBLISHABLE_KEY}
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY}
        - VITE_POSTHOG_API_KEY=${VITE_POSTHOG_API_KEY}
        - VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST}
    container_name: jobhunter-frontend
    ports:
      - "3002:80"   # Nginx inside container → exposed to host (3000 = VSRN)
    restart: always
    networks:
      - jobhunter-network

networks:
  jobhunter-network:
    driver: bridge
