      "@type": "Question",
      "name": "Is JobHunter free to use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The core job search and application automation features will be free during beta. Skill Development Programs (Phase 3) are paid, with a full refund if you don't get placed."
      }
    },
    {
      "@type": "Question",
      "name": "Will the AI fabricate anything on my resume?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Never. The AI curates and reorders your existing resume content to match each job description. It identifies skill gaps but never invents experience, skills, or credentials."
      }
    },
    {
      "@type": "Question",
      "name": "Do applications go out without my approval?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Every AI-generated resume variant and cover letter sits in an approval queue. Nothing is sent until you explicitly sign off on it."
      }
    },
    {
      "@type": "Question",
      "name": "Which job boards does JobHunter scrape?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Phase 0 covers Naukri and Indeed. LinkedIn and additional sources are planned for Phase 1. All scraped data stays in your private database — it is never exported."
      }
    },
    {
      "@type": "Question",
      "name": "How does the Skill Development Program work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Verified working professionals run one-on-one or group sessions tailored to your job requirements or identified skill gaps. If you complete the program and don't get placed, your fee is refunded automatically."
      }
    },
    {
      "@type": "Question",
      "name": "Can I become a mentor?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. We're onboarding mentors for Phase 3. Head to the For Who page and fill in the mentor interest form — we'll reach out with details."
      }
    },
    {
      "@type": "Question",
      "name": "When does JobHunter launch?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We're currently in Phase 0 — building and validating the core engine. Join the waitlist to get notified when early access opens."
      }
    },
    {
      "@type": "Question",
      "name": "Is my data safe?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The scraped job dataset has no external export endpoints. GDPR and India's DPDPA consent and deletion workflows are built into the Phase 4 roadmap."
      }
    }
