  <script type="application/ld+json">
  {
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is JobHunter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "JobHunter is an AI-powered, human-in-the-loop job search companion. We automate job discovery, tailor your resume to each role without fabricating experience, and prepare applications for your explicit approval."
      }
    },
    {
      "@type": "Question",
      "name": "How does JobHunter find jobs for me?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "JobHunter scrapes relevant job listings from major platforms like Naukri and Indeed. We bring the best opportunities directly to your dashboard so you don't have to spend hours searching manually."
      }
    },
    {
      "@type": "Question",
      "name": "Does JobHunter automatically apply to jobs?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, and this is by design. JobHunter prepares your application, but every resume variant and cover letter sits in an approval queue. Nothing is sent without your explicit sign-off."
      }
    },
    {
      "@type": "Question",
      "name": "Does JobHunter customize my resume for every job?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The AI analyzes each job description and curates your existing resume content to highlight the most relevant skills and experience. It never fabricates or invents credentials."
      }
    },
    {
      "@type": "Question",
      "name": "Does JobHunter write my cover letter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. JobHunter generates a personalized cover letter for each role based on your tailored resume and the specific job requirements. You can review and edit it before sending."
      }
    },
    {
      "@type": "Question",
      "name": "Can JobHunter apply using my Gmail or Outlook account?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Once you approve an application, JobHunter uses a secure bridge to send the email directly from your connected Gmail or Outlook account, so you own the communication thread."
      }
    },
    {
      "@type": "Question",
      "name": "How is JobHunter different from LinkedIn or Indeed?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "LinkedIn and Indeed are job boards where you manually search and apply. JobHunter is a job search companion that sits on top of those boards, automating the discovery, tailoring, and drafting process for you."
      }
    },
    {
      "@type": "Question",
      "name": "Who is JobHunter built for?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "JobHunter is designed for college students, recent graduates, unemployed professionals, and freelancers who need to scale their job search without losing quality or burning out."
      }
    },
    {
      "@type": "Question",
      "name": "Is JobHunter free to use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The core job search and application automation is free during beta. Advanced Skill Development Programs (Phase 3) will be paid, with a full refund guarantee if you don't get placed."
      }
    },
    {
      "@type": "Question",
      "name": "Is JobHunter available outside India?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "While our platform is currently optimized for the Indian job market (covering Naukri and Indeed India), it is not restricted. Job seekers globally can use JobHunter, and we plan to expand coverage to more international job boards soon."
      }
    },
    {
      "@type": "Question",
      "name": "Is my data safe?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Absolutely. The scraped job dataset has no external export endpoints. We are building in public with privacy first, incorporating GDPR and India's DPDPA compliance into our roadmap."
      }
    },
    {
      "@type": "Question",
      "name": "Can I become a mentor?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. We're onboarding mentors for Phase 3. Head to the For Who page and fill in the mentor form to join our verified professional network."
      }
    }
  ]
}
