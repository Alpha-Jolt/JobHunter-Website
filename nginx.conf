server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # ?page= param: 301-redirect to the clean path (strips ALL query
    # params, including ?page= itself) to break the redirect loop.
    # Old links like /for-who?page=for-who → 301 /for-who  ✓
    # ------------------------------------------------------------------
    if ($arg_page) {
        # Redirect to ONLY the clean path — do NOT re-append $args here.
        # Using $is_args$args would re-add ?page=xxx and cause an
        # infinite redirect loop (the exact bug this block is fixing).
        return 301 /$arg_page;
    }

    # Hashed Vite assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Trailing-slash normalisation:
    # /features/ and /for-who/ → 301 to /features and /for-who
    # Prevents Nginx from serving the prerendered directory-index URL
    # as a distinct page and stops the trailing-slash redirect loop.
    # ------------------------------------------------------------------
    location ~ ^/(.+)/$ {
        return 301 /$1;
    }

    # ------------------------------------------------------------------
    # Prerendered routes + SPA fallback
    # IMPORTANT: $uri/ intentionally removed — it caused Nginx to emit
    # an internal 301 /features → /features/ which Googlebot flagged
    # as a "Redirect error" for the sitemap URL /features.
    # The prerender script writes /features/index.html, so $uri/index.html
    # resolves it correctly without the intermediate directory redirect.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
