# VPS: /etc/nginx/sites-available/myjobhunter.in
# App: /docker/JobHunter-Website  →  docker compose  →  127.0.0.1:3002

############################################
# HTTP → HTTPS non-www (catches http://myjobhunter.in/*)
############################################
server {
    listen 80;
    server_name myjobhunter.in;
    return 301 https://myjobhunter.in$request_uri;
}

############################################
# HTTP www → HTTPS non-www
# (http://www.myjobhunter.in/* → https://myjobhunter.in/*)
############################################
server {
    listen 80;
    server_name www.myjobhunter.in;
    return 301 https://myjobhunter.in$request_uri;
}

############################################
# HTTPS www → non-www (canonical redirect)
# Fixes "Page with redirect" in GSC for
# https://www.myjobhunter.in/* URLs
############################################
server {
    listen 443 ssl http2;
    server_name www.myjobhunter.in;

    ssl_certificate /etc/ssl/cloudflare/jobhunter/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jobhunter/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://myjobhunter.in$request_uri;
}

############################################
# HTTPS SERVER — canonical non-www (DOCKER FRONTEND)
############################################
server {
    listen 443 ssl http2;
    server_name myjobhunter.in;

    # Cloudflare Origin Certificate (create under SSL/TLS → Origin Server)
    ssl_certificate /etc/ssl/cloudflare/jobhunter/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jobhunter/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ########################################
    # Trailing-slash normalisation (host level)
    # /faq/ → /faq  (301 before hitting Docker container)
    # Fixes GSC "Page with redirect" for trailing-slash URLs
    ########################################
    location ~ ^/(.+)/$ {
        return 301 https://myjobhunter.in/$1;
    }

    ########################################
    # Strip ?ref= tracking param server-side via 301
    # Fixes GSC "Page with redirect" for:
    #   /?ref=producthunt  /?ref=launches.uicomet.com  etc.
    # Google sees a clean 301 to the bare path instead of a
    # JS client-side URL replace (which GSC also counts as redirect).
    ########################################
    if ($arg_ref) {
        return 301 https://myjobhunter.in$uri;
    }

    ########################################
    # Frontend (Docker @ 3002)
    ########################################
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    ########################################
    # Ignore favicon noise if missing
    ########################################
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
}
