############################################
# HTTP → HTTPS
############################################
server {
    listen 80;
    server_name myjobhunter.in www.myjobhunter.in;
    return 301 https://$host$request_uri;
}

############################################
# HTTPS SERVER (DOCKER FRONTEND)
############################################
server {
    listen 443 ssl http2;
    server_name myjobhunter.in www.myjobhunter.in;

    # Cloudflare Origin Certificate (create under SSL/TLS → Origin Server)
    # Paths match your other sites — update if certs live elsewhere
    ssl_certificate /etc/ssl/cloudflare/jobhunter/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jobhunter/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ########################################
    # Frontend (Docker @ 3002)
    ########################################
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    ########################################
    # Ignore favicon noise if missing
    ########################################
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
}
